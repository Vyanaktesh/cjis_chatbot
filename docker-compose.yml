# Phase 1: core self-hosted infrastructure.
# Everything here runs locally via Docker — no third-party SaaS dependency,
# so this stack is safe to run on restricted/offline-ish government infra later.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
      # No silent fallback to a well-known password: `cp .env.example .env`
      # (which includes a development value) or set your own.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
    ports:
      # Bound to this machine only. Without the 127.0.0.1 prefix Docker
      # publishes the port on every network interface, exposing the database
      # to anything that can reach the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_admin} -d ${POSTGRES_DB:-rag_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag_net

  qdrant:
    # Pinned (it was "latest"): an unplanned image upgrade can change the API or
    # the on-disk storage format. Keep qdrant-client in requirements.txt within
    # one minor version of this tag, and upgrade both deliberately.
    image: qdrant/qdrant:v1.18.2
    container_name: rag_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      # The image no longer ships wget or curl, so the old `wget ... /healthz`
      # check failed forever and the container showed "unhealthy" while Qdrant
      # was fine. bash's built-in /dev/tcp needs no extra tools.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge
