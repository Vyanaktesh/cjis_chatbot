# Phase 1: core self-hosted infrastructure.
# Everything here runs locally via Docker — no third-party SaaS dependency,
# so this stack is safe to run on restricted/offline-ish government infra later.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
      # No silent fallback to a well-known password: `cp .env.example .env`
      # (which includes a development value) or set your own.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
    ports:
      # Bound to this machine only. Without the 127.0.0.1 prefix Docker
      # publishes the port on every network interface, exposing the database
      # to anything that can reach the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_admin} -d ${POSTGRES_DB:-rag_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag_net

  qdrant:
    # Pinned (it was "latest"): an unplanned image upgrade can change the API or
    # the on-disk storage format. Keep qdrant-client in requirements.txt within
    # one minor version of this tag, and upgrade both deliberately.
    image: qdrant/qdrant:v1.18.2
    container_name: rag_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      # The image no longer ships wget or curl, so the old `wget ... /healthz`
      # check failed forever and the container showed "unhealthy" while Qdrant
      # was fine. bash's built-in /dev/tcp needs no extra tools.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag_backend
    restart: unless-stopped
    # Secrets + tuning come from .env (copy .env.example). The overrides below
    # point the app at the compose service names, so the SAME .env still works
    # for non-docker local dev (where these default to localhost).
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
    volumes:
      # Approved content is served from Qdrant/Postgres; the embedding + whisper
      # models are baked into the image. This mount just lets the fetch/ingest
      # pipeline's downloaded GGUF generation model (if used) persist.
      - ./data/models:/app/data/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # 200 only when Postgres AND Qdrant are reachable (see /health). -f fails
      # on the 503 it returns otherwise, so "healthy" means genuinely ready.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - rag_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => the SPA uses relative API paths that nginx proxies to the
        # backend on this same origin (see frontend/nginx.conf).
        VITE_API_BASE_URL: ""
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # HTTPS (self-signed) so the mic works on a phone over the LAN.
      - "${FRONTEND_HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in the container localhost can resolve to
      # ::1 (IPv6) first, where nginx isn't listening, so the check would fail
      # even though the server is up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge
