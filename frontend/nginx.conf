# Serves the built SPA and reverse-proxies the API to the backend container on
# the SAME origin, so the login session cookie and CORS are a non-issue.
server {
    listen 80;
    # HTTPS with a self-signed cert so the microphone works off-device. Browsers
    # only allow getUserMedia in a "secure context" (https:// or localhost), so
    # a phone on the LAN must reach the site over https. The cert is self-signed,
    # so the phone shows a one-time "not private" warning -- tap through it once
    # and the mic works. http on port 80 still works for localhost on the laptop.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Audio recordings (up to MAX_AUDIO_BYTES, 15MB) and photos (8MB) ride
    # through this proxy, so allow a comfortably larger body than the defaults.
    client_max_body_size 20m;

    # API routes -> backend. "backend" is the compose service name on the
    # shared network. Each location proxies one of the FastAPI route prefixes.
    location ~ ^/(health|auth|chat|generate|search|support|citizen-corner|transcribe) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation (and the first, model-loading request) can take a while;
        # give it generous time before nginx gives up.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA fallback: every other path serves the app shell so client-side
    # routing works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
